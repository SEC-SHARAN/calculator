<html>
<head>
    <title>Calculator</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light d-flex flex-column justify-content-center align-items-center vh-100 m-0">

    <div class="card shadow p-3 mb-3 bg-body rounded" style="width: 300px;">
        <div class="card-body">
            <div class="mb-3">
                <input id="result" name="result" type="text" class="form-control text-end fs-4" readonly>
            </div> 
            <div class="container-fluid p-0">
                <div class="row g-2 mb-2">
                    <div class="col-3"><input type="button" value="9" class="btn btn-secondary w-100 py-2" onclick="result.value+='9'"></div>
                    <div class="col-3"><input type="button" value="8" class="btn btn-secondary w-100 py-2" onclick="result.value+='8'"></div>
                    <div class="col-3"><input type="button" value="7" class="btn btn-secondary w-100 py-2" onclick="result.value+='7'"></div>
                    <div class="col-3"><input type="button" value="+" class="btn btn-warning w-100 py-2" onclick="result.value+='+'"></div>
                </div>
                <div class="row g-2 mb-2">
                    <div class="col-3"><input type="button" value="6" class="btn btn-secondary w-100 py-2" onclick="result.value+='6'"></div>
                    <div class="col-3"><input type="button" value="5" class="btn btn-secondary w-100 py-2" onclick="result.value+='5'"></div>
                    <div class="col-3"><input type="button" value="4" class="btn btn-secondary w-100 py-2" onclick="result.value+='4'"></div>
                    <div class="col-3"><input type="button" value="-" class="btn btn-warning w-100 py-2" onclick="result.value+='-'"></div>
                </div>
                <div class="row g-2 mb-2">
                    <div class="col-3"><input type="button" value="3" class="btn btn-secondary w-100 py-2" onclick="result.value+='3'"></div>
                    <div class="col-3"><input type="button" value="2" class="btn btn-secondary w-100 py-2" onclick="result.value+='2'"></div>
                    <div class="col-3"><input type="button" value="1" class="btn btn-secondary w-100 py-2" onclick="result.value+='1'"></div>
                    <div class="col-3"><input type="button" value="*" class="btn btn-warning w-100 py-2" onclick="result.value+='*'"></div>
                </div>
                <div class="row g-2">
                    <div class="col-3"><input type="button" value="0" class="btn btn-secondary w-100 py-2" onclick="result.value+='0'"></div>
                    <div class="col-3"><input type="button" value="=" class="btn btn-success w-100 py-2" onclick="result.value=eval(result.value)"></div>
                    <div class="col-3"><input type="button" value="C" class="btn btn-danger w-100 py-2" onclick="result.value=''"></div>
                    <div class="col-3"><input type="button" value="/" class="btn btn-warning w-100 py-2" onclick="result.value+='/'"></div>
                </div>
            </div>
        </div>
    </div>
    <footer class="text-center text-muted small">
        Developed by SHARAN
    </footer>

</body>
</html>
